name: Build Eagle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packaging dependency
        run: brew install ldid

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eagle-unsigned-IPA
          path: |
            build/Eagle.ipa
            build/xcodebuild.log

      - name: Update nightly prerelease
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly \
              --title "Eagle Nightly" \
              --notes "Automated, unsigned development build." \
              --prerelease
          gh release upload nightly build/Eagle.ipa --clobber
